name: Coleta diária e publicação

on:
  schedule:
    # Todo dia às 09:17 UTC (06:17 em Brasília). Minuto "quebrado" evita a fila do horário cheio.
    - cron: '17 9 * * *'
  # Botão "Run workflow" na aba Actions e botão "Coletar agora" do site.
  workflow_dispatch:
  # Ao salvar o catálogo pelo site (ou qualquer push na main), coleta canais novos e republica.
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testes
        run: npm test

      - name: Coletar dados da YouTube API
        run: node scripts/collect.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Salvar histórico no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/stats.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git commit -m "Coleta $(date -u +%F)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

  publicar:
    needs: coletar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Pega a branch atualizada (com o commit da coleta), não o commit que disparou o workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
